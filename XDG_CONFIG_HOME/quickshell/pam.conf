# PAM service config for the quickshell lock screen, referenced by
# PamContext (configDirectory: Quickshell.shellDir, config: "pam.conf").
# Inlined from /usr/lib/pam.d/base-auth etc: with a custom config
# directory, PAM `include` directives do not resolve modules from
# /usr/lib/pam.d on this system and authentication fails, so the
# config must be self-contained.
auth     required pam_unix.so nullok
auth     required pam_nologin.so
auth     required pam_env.so

account  required pam_unix.so
account  required pam_nologin.so

session  required pam_env.so
session  required pam_limits.so
session  required pam_unix.so
