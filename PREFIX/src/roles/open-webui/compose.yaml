name: open-webui
services:
    open-webui:
        image: ghcr.io/open-webui/open-webui:main
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - $PORT:8080
        volumes:
            - /srv/open-webui:/app/backend/data
        environment:
            WEBUI_URL: "$WEBUI_URL"
            ENABLE_OLLAMA_API: "True"
            OLLAMA_BASE_URLS: "$OLLAMA_BASE_URLS"
            #OLLAMA_API_CONFIGS: '{"0": {"enable": true, "model_ids": ["qwen3.8"]}}'
            DEFAULT_MODEL_PARAMS: '{"function_calling": "native", "web_search": true}'
            DEFAULT_MODEL_METADATA: '{"capabilities":{"vision":true,"web_search":true}}'
            ENABLE_WEB_SEARCH: "True"
            WEB_SEARCH_ENGINE: "searxng"
            SEARXNG_QUERY_URL: "http://host.docker.internal/search/"
